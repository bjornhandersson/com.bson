<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MvtNet — Flight Routes</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.92);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.92); }
    .popup-route { font-weight: 600; font-size: 15px; }
    .popup-dist { margin-top: 4px; color: #38bdf8; font-variant-numeric: tabular-nums; }

    #demo-nav {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 1;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    #demo-nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    #demo-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }
    #demo-nav a.active { color: #38bdf8; background: rgba(56,189,248,0.12); }
    #demo-nav a.home { font-weight: 600; color: #f1f5f9; }

    #title-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 24px;
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 1;
      white-space: nowrap;
    }
    #title-bar span { color: #38bdf8; }

    #legend {
      position: absolute;
      bottom: 36px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 1;
    }
    #legend h4 { margin-bottom: 8px; font-size: 13px; font-weight: 600; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-line {
      width: 24px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="demo-nav">
    <a href="/" class="home">MvtNet</a>
    <a href="/cities.html">Cities</a>
    <a href="/earthquakes.html">Earthquakes</a>
    <a href="/routes.html" class="active">Routes</a>
    <a href="/timezones.html">Timezones</a>
  </div>

  <div id="title-bar">
    <span>MvtNet</span> — Flight Routes (LineString)
  </div>

  <div id="legend">
    <h4>Distance</h4>
    <div class="legend-row"><div class="legend-line" style="background:#34d399"></div> &lt; 2,000 km</div>
    <div class="legend-row"><div class="legend-line" style="background:#fbbf24"></div> 2,000 – 6,000 km</div>
    <div class="legend-row"><div class="legend-line" style="background:#f87171"></div> &gt; 6,000 km</div>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [40, 25],
      zoom: 2,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', () => {
      map.addSource('routes', {
        type: 'vector',
        tiles: [window.location.origin + '/tiles/routes/{z}/{x}/{y}'],
        minzoom: 0,
        maxzoom: 14
      });

      map.addLayer({
        id: 'routes-glow',
        type: 'line',
        source: 'routes',
        'source-layer': 'routes',
        paint: {
          'line-color': [
            'interpolate', ['linear'], ['get', 'distance_km'],
            500, '#34d399',  2000, '#34d399',  6000, '#fbbf24',  12000, '#f87171'
          ],
          'line-width': 6,
          'line-opacity': 0.15,
          'line-blur': 4
        }
      });

      map.addLayer({
        id: 'routes-line',
        type: 'line',
        source: 'routes',
        'source-layer': 'routes',
        paint: {
          'line-color': [
            'interpolate', ['linear'], ['get', 'distance_km'],
            500, '#34d399',  2000, '#34d399',  6000, '#fbbf24',  12000, '#f87171'
          ],
          'line-width': [
            'interpolate', ['linear'], ['zoom'],
            1, 1.5,  6, 3
          ],
          'line-opacity': 0.85
        },
        layout: {
          'line-cap': 'round',
          'line-join': 'round'
        }
      });

      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });

      map.on('click', 'routes-line', (e) => {
        const { from, to, distance_km } = e.features[0].properties;
        const dist = Number(distance_km).toLocaleString();
        popup
          .setLngLat(e.lngLat)
          .setHTML(
            `<div class="popup-route">${from} &rarr; ${to}</div>` +
            `<div class="popup-dist">${dist} km</div>`
          )
          .addTo(map);
      });

      map.on('mouseenter', 'routes-line', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'routes-line', () => map.getCanvas().style.cursor = '');
      map.on('click', (e) => {
        if (!map.queryRenderedFeatures(e.point, { layers: ['routes-line'] }).length) {
          popup.remove();
        }
      });
    });
  </script>
</body>
</html>
