<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MvtNet — KML Upload</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.92);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 320px;
    }
    .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.92); }
    .popup-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .popup-desc { color: #cbd5e1; font-size: 13px; }
    .popup-desc img { max-width: 100%; height: auto; }

    #demo-nav {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 2;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    #demo-nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    #demo-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }
    #demo-nav a.active { color: #38bdf8; background: rgba(56,189,248,0.12); }
    #demo-nav a.home { font-weight: 600; color: #f1f5f9; }

    #title-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 24px;
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 2;
      white-space: nowrap;
    }
    #title-bar span { color: #38bdf8; }

    #drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: opacity 0.25s;
    }
    #drop-overlay.hidden { opacity: 0; pointer-events: none; }

    #drop-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 48px 64px;
      text-align: center;
      color: #f1f5f9;
      max-width: 480px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #drop-card:hover, #drop-card.dragover {
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.98);
      transform: scale(1.02);
    }
    #drop-card svg { color: #38bdf8; margin-bottom: 16px; }
    #drop-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    #drop-card p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    #drop-card .hint { margin-top: 16px; font-size: 12px; color: #64748b; }

    #upload-pill {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 18px;
      color: #e2e8f0;
      font-size: 13px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 2;
      display: none;
      gap: 12px;
      align-items: center;
    }
    #upload-pill.visible { display: flex; }
    #upload-pill .count { color: #38bdf8; font-weight: 600; }
    #upload-pill button {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    #upload-pill button:hover { background: rgba(56, 189, 248, 0.2); }

    #error-toast {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(127, 29, 29, 0.95);
      color: #fecaca;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 4;
      display: none;
      max-width: 480px;
    }
    #error-toast.visible { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="demo-nav">
    <a href="/" class="home">MvtNet</a>
    <a href="/cities.html">Cities</a>
    <a href="/earthquakes.html">Earthquakes</a>
    <a href="/timezones.html">Timezones</a>
    <a href="/upload.html" class="active">KML Upload</a>
  </div>

  <div id="title-bar">
    <span>MvtNet</span> &mdash; KML Upload
  </div>

  <div id="drop-overlay">
    <label id="drop-card">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <h2>Drop a KML file</h2>
      <p>or click to choose. The file is parsed server-side, served as MVT tiles, and rendered with its original styling.</p>
      <p class="hint">Try a Google Earth export, or grab the sample <code>KML_Samples.kml</code>.</p>
      <input type="file" id="file-input" accept=".kml,application/vnd.google-earth.kml+xml" hidden />
    </label>
  </div>

  <div id="upload-pill">
    <span><span class="count" id="feature-count">0</span> features loaded</span>
    <button id="replace-btn">Replace</button>
  </div>

  <div id="error-toast"></div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [0, 20],
      zoom: 1.5,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    let tileVersion = 0;

    function tileUrl() {
      return `${window.location.origin}/tiles/upload/{z}/{x}/{y}?v=${tileVersion}`;
    }

    map.on('load', () => {
      map.addSource('kml', {
        type: 'vector',
        tiles: [tileUrl()],
        minzoom: 0,
        maxzoom: 14
      });

      // Polygon fill
      map.addLayer({
        id: 'kml-polygon-fill',
        type: 'fill',
        source: 'kml',
        'source-layer': 'kml',
        filter: ['==', '$type', 'Polygon'],
        paint: {
          'fill-color': ['coalesce', ['get', 'fillColor'], '#3388ffaa'],
          'fill-opacity': ['case', ['==', ['get', 'filled'], false], 0, 1]
        }
      });

      // Polygon outline
      map.addLayer({
        id: 'kml-polygon-stroke',
        type: 'line',
        source: 'kml',
        'source-layer': 'kml',
        filter: ['==', '$type', 'Polygon'],
        paint: {
          'line-color': ['coalesce', ['get', 'lineColor'], '#3388ff'],
          'line-width': ['coalesce', ['get', 'lineWidth'], 1],
          'line-opacity': ['case', ['==', ['get', 'outlined'], false], 0, 1]
        }
      });

      // Lines
      map.addLayer({
        id: 'kml-line',
        type: 'line',
        source: 'kml',
        'source-layer': 'kml',
        filter: ['==', '$type', 'LineString'],
        paint: {
          'line-color': ['coalesce', ['get', 'lineColor'], '#38bdf8'],
          'line-width': ['coalesce', ['get', 'lineWidth'], 2]
        }
      });

      // Points without an icon — fallback dot
      map.addLayer({
        id: 'kml-point-circle',
        type: 'circle',
        source: 'kml',
        'source-layer': 'kml',
        filter: ['all', ['==', '$type', 'Point'], ['!', ['has', 'icon']]],
        paint: {
          'circle-radius': 5,
          'circle-color': '#fbbf24',
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 1
        }
      });

      // Points with an icon
      map.addLayer({
        id: 'kml-point-symbol',
        type: 'symbol',
        source: 'kml',
        'source-layer': 'kml',
        filter: ['all', ['==', '$type', 'Point'], ['has', 'icon']],
        layout: {
          'icon-image': ['get', 'icon'],
          'icon-size': ['*', ['coalesce', ['get', 'iconScale'], 1], 0.5],
          'icon-allow-overlap': true,
          'icon-anchor': 'bottom'
        }
      });

      const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, offset: 12 });

      function showPopup(e) {
        const f = e.features[0];
        const p = f.properties || {};
        const html =
          (p.name ? `<div class="popup-name">${escapeHtml(p.name)}</div>` : '') +
          (p.description ? `<div class="popup-desc">${p.description}</div>` : '');
        if (!html) { return; }
        popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      }

      ['kml-point-circle', 'kml-point-symbol', 'kml-line', 'kml-polygon-fill'].forEach(id => {
        map.on('click', id, showPopup);
        map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
      });
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function loadIcon(url) {
      if (map.hasImage(url)) { return Promise.resolve(); }
      return map
        .loadImage(`/icons?url=${encodeURIComponent(url)}`)
        .then(({ data }) => {
          if (!map.hasImage(url)) {
            map.addImage(url, data);
          }
        })
        .catch(() => { /* missing icon — fallback dot will render */ });
    }

    async function handleUpload(file) {
      hideError();
      const fd = new FormData();
      fd.append('file', file);
      let res;
      try {
        res = await fetch('/upload', { method: 'POST', body: fd });
      } catch (e) {
        showError('Upload failed: ' + e.message);
        return;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        showError('Parse failed: ' + (err.error || res.statusText));
        return;
      }
      const data = await res.json();

      await Promise.all((data.icons || []).map(loadIcon));

      tileVersion++;
      map.getSource('kml').setTiles([tileUrl()]);

      if (data.bounds) {
        map.fitBounds(
          [[data.bounds[0], data.bounds[1]], [data.bounds[2], data.bounds[3]]],
          { padding: 60, duration: 800, maxZoom: 12 }
        );
      }

      document.getElementById('feature-count').textContent = data.features;
      document.getElementById('upload-pill').classList.add('visible');
      document.getElementById('drop-overlay').classList.add('hidden');
    }

    function showError(msg) {
      const el = document.getElementById('error-toast');
      el.textContent = msg;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 5000);
    }

    function hideError() {
      document.getElementById('error-toast').classList.remove('visible');
    }

    const fileInput = document.getElementById('file-input');
    const dropCard = document.getElementById('drop-card');
    const dropOverlay = document.getElementById('drop-overlay');
    const replaceBtn = document.getElementById('replace-btn');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) { handleUpload(fileInput.files[0]); }
    });

    replaceBtn.addEventListener('click', () => {
      dropOverlay.classList.remove('hidden');
    });

    // Drag & drop on the entire window
    ['dragenter', 'dragover'].forEach(evt =>
      window.addEventListener(evt, (e) => {
        e.preventDefault();
        dropOverlay.classList.remove('hidden');
        dropCard.classList.add('dragover');
      })
    );
    ['dragleave', 'drop'].forEach(evt =>
      window.addEventListener(evt, (e) => {
        if (evt === 'dragleave' && e.relatedTarget) { return; }
        dropCard.classList.remove('dragover');
      })
    );
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer?.files?.[0];
      if (file) { handleUpload(file); }
    });
  </script>
</body>
</html>
