<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MvtNet — World Timezones</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.92);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.92); }
    .popup-name { font-weight: 600; font-size: 15px; }
    .popup-offset { margin-top: 4px; color: #a78bfa; font-size: 16px; font-weight: 700; }

    #demo-nav {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 1;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    #demo-nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    #demo-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }
    #demo-nav a.active { color: #38bdf8; background: rgba(56,189,248,0.12); }
    #demo-nav a.home { font-weight: 600; color: #f1f5f9; }

    #title-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 24px;
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 1;
      white-space: nowrap;
    }
    #title-bar span { color: #38bdf8; }

    #legend {
      position: absolute;
      bottom: 36px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      z-index: 1;
    }
    #legend h4 { margin-bottom: 10px; font-size: 13px; font-weight: 600; }
    .legend-gradient {
      width: 160px;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #f472b6, #a78bfa, #60a5fa, #34d399, #fbbf24, #fb923c, #f87171);
      margin-bottom: 4px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="demo-nav">
    <a href="/" class="home">MvtNet</a>
    <a href="/cities.html">Cities</a>
    <a href="/earthquakes.html">Earthquakes</a>
    <a href="/timezones.html" class="active">Timezones</a>
    <a href="/upload.html">KML Upload</a>
  </div>

  <div id="title-bar">
    <span>MvtNet</span> — World Timezones (Polygon)
  </div>

  <div id="legend">
    <h4>UTC Offset</h4>
    <div class="legend-gradient"></div>
    <div class="legend-labels">
      <span>-12</span>
      <span>0</span>
      <span>+12</span>
    </div>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [20, 25],
      zoom: 2.5,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', () => {
      map.addSource('timezones', {
        type: 'vector',
        tiles: [window.location.origin + '/tiles/timezones/{z}/{x}/{y}'],
        minzoom: 0,
        maxzoom: 8
      });

      map.addLayer({
        id: 'tz-fill',
        type: 'fill',
        source: 'timezones',
        'source-layer': 'timezones',
        paint: {
          'fill-color': [
            'interpolate', ['linear'], ['get', 'zone'],
            -12, '#f472b6',
            -6,  '#a78bfa',
            -2,  '#60a5fa',
            0,   '#38bdf8',
            2,   '#34d399',
            6,   '#fbbf24',
            10,  '#fb923c',
            12,  '#f87171'
          ],
          'fill-opacity': 0.5
        }
      });

      map.addLayer({
        id: 'tz-outline',
        type: 'line',
        source: 'timezones',
        'source-layer': 'timezones',
        paint: {
          'line-color': 'rgba(255, 255, 255, 0.15)',
          'line-width': 0.8
        }
      });

      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 4 });

      map.on('click', 'tz-fill', (e) => {
        const { name, zone } = e.features[0].properties;
        const offset = Number(zone);
        const sign = offset >= 0 ? '+' : '';
        const label = offset % 1 === 0 ? `UTC${sign}${offset}` : `UTC${sign}${offset.toFixed(1)}`;
        popup
          .setLngLat(e.lngLat)
          .setHTML(
            `<div class="popup-name">${name}</div>` +
            `<div class="popup-offset">${label}</div>`
          )
          .addTo(map);
      });

      map.on('mouseenter', 'tz-fill', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'tz-fill', () => map.getCanvas().style.cursor = '');
      map.on('click', (e) => {
        if (!map.queryRenderedFeatures(e.point, { layers: ['tz-fill'] }).length) {
          popup.remove();
        }
      });
    });
  </script>
</body>
</html>
