name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MvtNet
            solution: dotnet/MvtNet/MvtNet.slnx
          - name: Dispatcher
            solution: dotnet/Dispatcher/Dispatcher.sln
          - name: HilbertIndex
            solution: dotnet/HilbertIndex/HilbertIndex.sln
          - name: Raft
            solution: dotnet/Raft/Raft.sln
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ matrix.solution }} -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: "**/TestResults/**"
          if-no-files-found: ignore
