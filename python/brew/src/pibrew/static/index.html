<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiBrew - Brewing Control System</title>
    <script src="js/jquery.min.js" type="text/javascript"></script>
    <script src="js/float/jquery.flot.js" type="text/javascript"></script>
    <script src="js/piBrew.js" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --secondary-color: #D2691E;
            --accent-color: #CD853F;
            --success-color: #228B22;
            --warning-color: #FF8C00;
            --danger-color: #DC143C;
            --dark-color: #2C1810;
            --light-color: #F5F5DC;
            --background-color: #FFF8DC;
            --card-background: #FFFFFF;
            --text-color: #2C1810;
            --border-color: #DDD;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--background-color) 0%, #F0E68C 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: var(--secondary-color);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            color: var(--primary-color);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            text-align: center;
            padding: 15px;
            background: var(--light-color);
            border-radius: 8px;
            border: 2px solid var(--accent-color);
        }

        .status-label {
            font-size: 0.9rem;
            color: var(--secondary-color);
            font-weight: 500;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 500;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .input-field {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--dark-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #1e7e1e;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #b91c3c;
            transform: translateY(-2px);
        }

        .gpio-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .gpio-group {
            padding: 15px;
            background: var(--light-color);
            border-radius: 8px;
            border: 2px solid var(--accent-color);
        }

        .gpio-group h4 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        .chart-container {
            grid-column: 1 / -1;
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        #chart {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-running {
            background: var(--success-color);
            animation: pulse 2s infinite;
        }

        .status-stopped {
            background: var(--danger-color);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .brewing-icon {
            font-size: 2rem;
            color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .gpio-controls {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-beer brewing-icon"></i>
                PiBrew
                <i class="fas fa-thermometer-half brewing-icon"></i>
            </h1>
            <p>Professional Brewing Temperature Control System</p>
        </div>

        <div class="dashboard">
            <!-- System Status -->
            <div class="card">
                <h3><i class="fas fa-tachometer-alt"></i> System Status</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">Current Temp</div>
                        <div class="status-value" id="spTemp">0.0°C</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Target Temp</div>
                        <div class="status-value" id="spTarget">0.0°C</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Heater Power</div>
                        <div class="status-value" id="spPower">0.0%</div>
                    </div>
                </div>
                <button id="startStop" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-play"></i>
                    <span>Start Brewing</span>
                </button>
            </div>

            <!-- Controls -->
            <div class="card">
                <h3><i class="fas fa-sliders-h"></i> Brewing Controls</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="target">Target Temperature (°C)</label>
                        <input type="number" id="target" class="input-field" value="0.0" step="0.1" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- PID Controls -->
            <div class="card">
                <h3><i class="fas fa-cogs"></i> PID Parameters</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="KP">Proportional (Kp)</label>
                        <input type="number" id="KP" class="input-field pid" value="0.0" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="KI">Integral (Ki)</label>
                        <input type="number" id="KI" class="input-field pid" value="0.0" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="KD">Derivative (Kd)</label>
                        <input type="number" id="KD" class="input-field pid" value="0.0" step="0.001">
                    </div>
                </div>
            </div>

            <!-- GPIO Controls -->
            <div class="card">
                <h3><i class="fas fa-microchip"></i> Hardware Controls</h3>
                <div class="gpio-controls">
                    <div class="gpio-group">
                        <h4><i class="fas fa-lightbulb"></i> Heater LED (Pin 15)</h4>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input id="15off" type="radio" name="pin15" checked>
                                <span>Off</span>
                            </label>
                            <label class="radio-option">
                                <input id="15on" type="radio" name="pin15">
                                <span>On</span>
                            </label>
                        </div>
                    </div>
                    <div class="gpio-group">
                        <h4><i class="fas fa-fire"></i> Heater Relay (Pin 13)</h4>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input id="13off" type="radio" name="pin13" checked>
                                <span>Off</span>
                            </label>
                            <label class="radio-option">
                                <input id="13on" type="radio" name="pin13">
                                <span>On</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Temperature Chart -->
            <div class="chart-container">
                <h3><i class="fas fa-chart-line"></i> Temperature Chart</h3>
                <div id="chart"></div>
            </div>
        </div>

        <div class="footer">
            <p><i class="fas fa-copyright"></i> 2025 PiBrew - Professional Brewing Control System</p>
        </div>
    </div>

    <script>
        var doPoll = false;
        var dtStart = new Date();
        var tempData = [[0,0]];
        var setData = [[0,0]];
        var isRunning = false;
        
        var brew = new piBrew();
        
        // Load initial PID values
        brew.getPID().success(function(data) {
            $('#KP').val(data.kp);
            $('#KI').val(data.ki);
            $('#KD').val(data.kd);
        });
        
        // PID parameter change handler
        $('.pid').change(function() {
            brew.setPID(
                $('#KP').val(),
                $('#KI').val(),
                $('#KD').val()
            );
        });
        
        // Target temperature change handler
        $('#target').change(function() {
            brew.setTarget($(this).val());
        });
        
        // Start/Stop button handler
        $('#startStop').click(function() {
            var $btn = $(this);
            var $icon = $btn.find('i');
            var $text = $btn.find('span');
            
            if (!isRunning) {
                brew.startStop(true).success(function(data) {
                    isRunning = true;
                    $btn.removeClass('btn-primary').addClass('btn-danger');
                    $icon.removeClass('fa-play').addClass('fa-stop');
                    $text.text('Stop Brewing');
                    
                    if (!doPoll) {
                        doPoll = true;
                        poll();
                    }
                });
            } else {
                brew.startStop(false).success(function(data) {
                    isRunning = false;
                    $btn.removeClass('btn-danger').addClass('btn-primary');
                    $icon.removeClass('fa-stop').addClass('fa-play');
                    $text.text('Start Brewing');
                    doPoll = false;
                });
            }
        });
        
        // GPIO control handlers
        $(':radio').click(function() {
            var pin = 0;
            var state = false;
            
            var rb = $(this)[0].id;
            switch(rb) {
                case '13off':
                    pin = 13;
                    state = false;
                    break;
                case '13on':
                    pin = 13;
                    state = true;
                    break;
                case '15off':
                    pin = 15;
                    state = false;
                    break;
                case '15on':
                    pin = 15;
                    state = true;
                    break;
            }
            
            brew.toggle(state, pin, function(response){
                // Optional: Add visual feedback
            });
        });
        
        // Polling function for real-time updates
        var count = 0;
        function poll() {
            brew.getStatus().success(function(data){
                // Update status displays
                $('#spTemp').html((Math.round(data.temperature * 100) / 100).toFixed(2) + '°C');
                $('#spTarget').html((Math.round(data.target_temperature * 100) / 100).toFixed(2) + '°C');
                $('#spPower').html((Math.round(data.heater_power * 100) / 100).toFixed(2) + '%');
                
                // Update chart data
                if(count++ % 2 == 0) {
                    var t = (new Date().getTime() - dtStart.getTime()) / 1000;
                    tempData.push([t, data.temperature]);
                    setData.push([t, $('#target').val()]);
                }
            });
            
            // Update chart
            if(tempData.length % 2 == 0) {
                $.plot($("#chart"), [
                    {
                        data: tempData,
                        label: "Current Temperature",
                        color: "#DC143C",
                        lines: { show: true, lineWidth: 3 },
                        points: { show: true, radius: 3 }
                    },
                    {
                        data: setData,
                        label: "Target Temperature",
                        color: "#228B22",
                        lines: { show: true, lineWidth: 2, fill: false },
                        points: { show: false }
                    }
                ], {
                    xaxis: { 
                        axisLabel: "Time (seconds)",
                        axisLabelUseCanvas: true,
                        axisLabelFontSizePixels: 12,
                        axisLabelFontFamily: 'Inter'
                    },
                    yaxis: { 
                        axisLabel: "Temperature (°C)",
                        axisLabelUseCanvas: true,
                        axisLabelFontSizePixels: 12,
                        axisLabelFontFamily: 'Inter'
                    },
                    legend: {
                        position: "nw",
                        backgroundColor: "rgba(255, 255, 255, 0.8)"
                    },
                    grid: {
                        backgroundColor: "#FFFFFF",
                        borderColor: "#DDD",
                        borderWidth: 1
                    }
                });
            }
            
            if(doPoll) {
                setTimeout(poll, 1000);
            }
        }
        
        // Start polling immediately
        doPoll = true;
        poll();
    </script>
</body>
</html>
