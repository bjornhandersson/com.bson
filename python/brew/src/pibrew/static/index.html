<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiBrew - Brewing Control System</title>
    <script src="js/jquery.min.js" type="text/javascript"></script>
    <script src="js/float/jquery.flot.js" type="text/javascript"></script>
    <script src="js/piBrew.js" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --secondary-color: #D2691E;
            --accent-color: #CD853F;
            --success-color: #2ECC71;
            --warning-color: #F39C12;
            --danger-color: #E74C3C;
            --dark-color: #2C1810;
            --light-color: #FFF8DC;
            --background-gradient: linear-gradient(135deg, #FFF8DC 0%, #F5DEB3 25%, #DEB887 50%, #D2B48C 75%, #BC9A6A 100%);
            --card-background: rgba(255, 255, 255, 0.95);
            --text-color: #2C1810;
            --border-color: rgba(139, 69, 19, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
            --border-radius: 16px;
            --glass-effect: backdrop-filter: blur(10px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" patternUnits="userSpaceOnUse" width="100" height="100"><circle cx="25" cy="25" r="2" fill="%23D2691E" opacity="0.1"/><circle cx="75" cy="75" r="1.5" fill="%238B4513" opacity="0.1"/><circle cx="50" cy="10" r="1" fill="%23CD853F" opacity="0.1"/><circle cx="10" cy="60" r="1.5" fill="%23D2691E" opacity="0.1"/><circle cx="90" cy="30" r="1" fill="%238B4513" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(210, 105, 30, 0.1), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: var(--secondary-color);
            font-size: 1.2rem;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .brewing-icon {
            font-size: 2.5rem;
            color: var(--secondary-color);
            animation: float 3s ease-in-out infinite;
        }

        .brewing-icon:nth-child(3) {
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .hardware-card {
            grid-column: 1 / -1;
        }

        .card {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card:hover::before {
            left: 100%;
        }

        .card h3 {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .status-item {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(135deg, var(--light-color), rgba(255, 248, 220, 0.8));
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .status-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--success-color), var(--warning-color), var(--danger-color));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .status-item:hover::before {
            transform: scaleX(1);
        }

        .status-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .status-label {
            font-size: 0.9rem;
            color: var(--secondary-color);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, white, rgba(255, 255, 255, 0.9));
            font-family: 'Poppins', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(210, 105, 30, 0.2);
            transform: scale(1.02);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
            color: white;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--dark-color), #1a0f08);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #27AE60);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #27AE60, #229954);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color), #C0392B);
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #C0392B, #A93226);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        .gpio-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .gpio-group {
            padding: 30px;
            background: linear-gradient(135deg, var(--light-color), rgba(255, 248, 220, 0.8));
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            transition: all 0.3s ease;
            min-height: 140px;
        }

        .gpio-group:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .gpio-group h4 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-group {
            display: flex;
            gap: 25px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .radio-option:hover {
            background: rgba(210, 105, 30, 0.1);
        }

        .radio-option input[type="radio"] {
            width: 24px;
            height: 24px;
            accent-color: var(--primary-color);
        }

        .chart-container {
            grid-column: 1 / -1;
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .chart-container:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        #chart {
            width: 100%;
            height: 450px;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            background: linear-gradient(135deg, white, rgba(255, 255, 255, 0.95));
        }

        .status-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 10px;
            position: relative;
        }

        .status-indicator::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.3;
        }

        .status-running {
            background: var(--success-color);
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .status-stopped {
            background: var(--danger-color);
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        @keyframes pulse {
            0% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.7; 
                transform: scale(1.1);
            }
            100% { 
                opacity: 1; 
                transform: scale(1);
            }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 25px;
            color: var(--secondary-color);
            font-size: 1rem;
            font-weight: 500;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .gpio-controls {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading animation */
        .loading {
            position: relative;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid var(--primary-color);
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glow effects */
        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px var(--accent-color); }
            to { box-shadow: 0 0 20px var(--accent-color), 0 0 30px var(--accent-color); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-beer brewing-icon"></i>
                PiBrew
                <i class="fas fa-thermometer-half brewing-icon"></i>
            </h1>
            <p>Professional Brewing Temperature Control System</p>
        </div>

        <div class="dashboard">
            <!-- System Status -->
            <div class="card">
                <h3><i class="fas fa-tachometer-alt"></i> System Status</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">Current Temp</div>
                        <div class="status-value" id="spTemp">0.0°C</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Target Temp</div>
                        <div class="status-value" id="spTarget">0.0°C</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Heater Power</div>
                        <div class="status-value" id="spPower">0.0%</div>
                    </div>
                </div>
                <button id="startStop" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-play"></i>
                    <span>Start Brewing</span>
                </button>
            </div>

            <!-- Controls -->
            <div class="card">
                <h3><i class="fas fa-sliders-h"></i> Brewing Controls</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="target"><i class="fas fa-bullseye"></i> Target Temperature (°C)</label>
                        <input type="number" id="target" class="input-field" value="0.0" step="0.1" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- PID Controls -->
            <div class="card">
                <h3><i class="fas fa-cogs"></i> PID Parameters</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="KP"><i class="fas fa-chart-line"></i> Proportional (Kp)</label>
                        <input type="number" id="KP" class="input-field pid" value="0.0" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="KI"><i class="fas fa-integral"></i> Integral (Ki)</label>
                        <input type="number" id="KI" class="input-field pid" value="0.0" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="KD"><i class="fas fa-wave-square"></i> Derivative (Kd)</label>
                        <input type="number" id="KD" class="input-field pid" value="0.0" step="0.001">
                    </div>
                </div>
            </div>

            <!-- GPIO Controls -->
            <div class="card hardware-card">
                <h3><i class="fas fa-microchip"></i> Hardware Controls</h3>
                <div class="gpio-controls">
                    <div class="gpio-group">
                        <h4><i class="fas fa-lightbulb"></i> Heater LED (Pin 15)</h4>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input id="15off" type="radio" name="pin15" checked>
                                <span>Off</span>
                            </label>
                            <label class="radio-option">
                                <input id="15on" type="radio" name="pin15">
                                <span>On</span>
                            </label>
                        </div>
                    </div>
                    <div class="gpio-group">
                        <h4><i class="fas fa-fire"></i> Heater Relay (Pin 13)</h4>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input id="13off" type="radio" name="pin13" checked>
                                <span>Off</span>
                            </label>
                            <label class="radio-option">
                                <input id="13on" type="radio" name="pin13">
                                <span>On</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Temperature Chart -->
            <div class="chart-container">
                <h3><i class="fas fa-chart-line"></i> Temperature Chart</h3>
                <div id="chart"></div>
            </div>
        </div>

        <div class="footer">
            <p><i class="fas fa-copyright"></i> 2025 PiBrew - Professional Brewing Control System</p>
        </div>
    </div>

    <script>
        var doPoll = false;
        var dtStart = new Date();
        var tempData = [[0,0]];
        var setData = [[0,0]];
        var isRunning = false;
        
        var brew = new piBrew();
        
        // Load initial PID values
        brew.getPID().success(function(data) {
            $('#KP').val(data.kp);
            $('#KI').val(data.ki);
            $('#KD').val(data.kd);
        });
        
        // PID parameter change handler
        $('.pid').change(function() {
            $(this).addClass('glow');
            setTimeout(() => $(this).removeClass('glow'), 1000);
            
            brew.setPID(
                $('#KP').val(),
                $('#KI').val(),
                $('#KD').val()
            );
        });
        
        // Target temperature change handler
        $('#target').change(function() {
            $(this).addClass('glow');
            setTimeout(() => $(this).removeClass('glow'), 1000);
            brew.setTarget($(this).val());
        });
        
        // Start/Stop button handler
        $('#startStop').click(function() {
            var $btn = $(this);
            var $icon = $btn.find('i');
            var $text = $btn.find('span');
            
            $btn.addClass('loading');
            
            if (!isRunning) {
                brew.startStop(true).success(function(data) {
                    isRunning = true;
                    $btn.removeClass('btn-primary loading').addClass('btn-danger');
                    $icon.removeClass('fa-play').addClass('fa-stop');
                    $text.text('Stop Brewing');
                    
                    if (!doPoll) {
                        doPoll = true;
                        poll();
                    }
                });
            } else {
                brew.startStop(false).success(function(data) {
                    isRunning = false;
                    $btn.removeClass('btn-danger loading').addClass('btn-primary');
                    $icon.removeClass('fa-stop').addClass('fa-play');
                    $text.text('Start Brewing');
                    doPoll = false;
                });
            }
        });
        
        // GPIO control handlers
        $(':radio').click(function() {
            var pin = 0;
            var state = false;
            
            var rb = $(this)[0].id;
            switch(rb) {
                case '13off':
                    pin = 13;
                    state = false;
                    break;
                case '13on':
                    pin = 13;
                    state = true;
                    break;
                case '15off':
                    pin = 15;
                    state = false;
                    break;
                case '15on':
                    pin = 15;
                    state = true;
                    break;
            }
            
            // Add visual feedback
            $(this).closest('.gpio-group').addClass('glow');
            setTimeout(() => $(this).closest('.gpio-group').removeClass('glow'), 500);
            
            brew.toggle(state, pin, function(response){
                // Optional: Add visual feedback
            });
        });
        
        // Polling function for real-time updates
        var count = 0;
        function poll() {
            brew.getStatus().success(function(data){
                // Update status displays with animations
                $('#spTemp').html((Math.round(data.temperature * 100) / 100).toFixed(2) + '°C');
                $('#spTarget').html((Math.round(data.target_temperature * 100) / 100).toFixed(2) + '°C');
                $('#spPower').html((Math.round(data.heater_power * 100) / 100).toFixed(2) + '%');
                
                // Add glow effect to active values
                if (data.heater_power > 0) {
                    $('#spPower').parent().addClass('glow');
                } else {
                    $('#spPower').parent().removeClass('glow');
                }
                
                // Update chart data
                if(count++ % 2 == 0) {
                    var t = (new Date().getTime() - dtStart.getTime()) / 1000;
                    tempData.push([t, data.temperature]);
                    setData.push([t, $('#target').val()]);
                }
            });
            
            // Update chart with enhanced styling
            if(tempData.length % 2 == 0) {
                $.plot($("#chart"), [
                    {
                        data: tempData,
                        label: "Current Temperature",
                        color: "#E74C3C",
                        lines: { show: true, lineWidth: 4, fill: false },
                        points: { show: true, radius: 4, fillColor: "#E74C3C" },
                        shadowSize: 2
                    },
                    {
                        data: setData,
                        label: "Target Temperature",
                        color: "#2ECC71",
                        lines: { show: true, lineWidth: 3, fill: false },
                        points: { show: false },
                        shadowSize: 1
                    }
                ], {
                    xaxis: { 
                        axisLabel: "Time (seconds)",
                        axisLabelUseCanvas: true,
                        axisLabelFontSizePixels: 14,
                        axisLabelFontFamily: 'Poppins',
                        color: "#8B4513"
                    },
                    yaxis: { 
                        axisLabel: "Temperature (°C)",
                        axisLabelUseCanvas: true,
                        axisLabelFontSizePixels: 14,
                        axisLabelFontFamily: 'Poppins',
                        color: "#8B4513"
                    },
                    legend: {
                        position: "nw",
                        backgroundColor: "rgba(255, 255, 255, 0.9)",
                        backgroundOpacity: 0.9,
                        labelBoxBorderColor: "#CD853F",
                        margin: 10
                    },
                    grid: {
                        backgroundColor: "rgba(255, 255, 255, 0.95)",
                        borderColor: "#CD853F",
                        borderWidth: 2,
                        hoverable: true,
                        clickable: true
                    }
                });
            }
            
            if(doPoll) {
                setTimeout(poll, 1000);
            }
        }
        
        // Start polling immediately
        doPoll = true;
        poll();
        
        // Add some interactive effects
        $('.status-item').hover(
            function() { $(this).addClass('glow'); },
            function() { $(this).removeClass('glow'); }
        );
    </script>
</body>
</html>
