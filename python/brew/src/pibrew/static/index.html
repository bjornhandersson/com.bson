<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<title>PIBrew</title>
		<script src="../js/jquery.min.js" type="text/javascript"></script>
		<script language="javascript" type="text/javascript" src="../js/float/jquery.flot.js"></script>
		<script src="../js/piBrew.js"></script>

	</head>
	<body>
		<div>
			PIN13
			<input id="13off" type="radio" name="pin13" checked="true" />Off
			<input id="13on" type="radio" name="pin13" />On
		</div>
		<div>
			PIN15
			<input id="15off" type="radio" name="pin15" checked="true" />Off
			<input id="15on" type="radio" name="pin15" />On
		</div>
		<div>
			<div id="response"></div>
		</div>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			P <input class="pid" id="KP" type="text" value="0.0" />
			I <input class="pid" id="KI" type="text" value="0.0" />
			D <input class="pid" id="KD" type="text" value="0.0" />
		</div>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			Target C <input id="target" value="0.0" />
		</div>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			Temp:&nbsp;<span id="spTemp"></span>
			Power:&nbsp;<span id="spPower"></span>%
			Target:&nbsp;<span id="spTarget"></span>
		</div>
		<div>
			<input id="startStop" type="button" value="start" />
		</div>
		<div id="chart" style="width:600px;height:300px">
		</div>
		<script>
			var doPoll = false;
			var dtStart = new Date();
			var tempData = [[0,0]];
			var setData = [[0,0]];
			
			var brew = new piBrew();
			brew.getPID().success(function(data) {
				jQuery('#KP').attr({'value':data.KP});
				jQuery('#KI').attr({'value':data.KI});
				jQuery('#KD').attr({'value':data.KD});
			});
			
			jQuery('.pid').change(function() {
				brew.setPID(
					jQuery('#KP')[0].value,
					jQuery('#KI')[0].value,
					jQuery('#KD')[0].value
				);
			})
			
			
			var count = 0;
			function poll() {
				brew.getStatus().success(function(data){
					jQuery('#spTemp').html((Math.round(data.temp * 100) / 100).toFixed(2));	
					jQuery('#spTarget').html((Math.round(data.target * 100) / 100).toFixed(2));	
					jQuery('#spPower').html((Math.round(data.power * 100) / 100).toFixed(2));
					
					if(count++ % 2 == 0) {
						var t = (new Date().getTime() - dtStart.getTime()) / 1000;
						tempData.push([t, data.temp]);
						setData.push([t, jQuery('#target')[0].value]);
					}		
				});
				
				if(tempData.length % 2 == 0)
					$.plot($("#chart"), [ tempData, setData ]);
					
				if(doPoll) {
					setTimeout(poll, 1000);
				}
			}
							
			doPoll = true;
			poll();
			
			
			
			jQuery('#target').change(function() {
				brew.setTarget(jQuery(this)[0].value);
			});
			
			jQuery('#startStop').click(function() {
				var _self = this;
				var st = jQuery(_self).attr('value') == 'start';
				var d = brew.startStop(st)
				d.success(function(data) {
					
					if(st && doPoll == false){
						doPoll = true;
						poll();
					}
					else if(!st && doPoll == true) {
						doPoll = false;
					}
					
					jQuery(_self).attr({'value': (st ? 'stop' : 'start')});
				});
			});

			
			$(':radio').click(function() {
				var pin = 0;
				var state = false;
				
				var rb = $(this)[0].id;
				switch(rb)
				{
					case '13off':
						pin = 13;
						state = false;
						break;
					case '13on':
						pin = 13;
						state = true;
						break;
					case '15off':
						pin = 15;
						state = false;
						break;
					case '15on':
						pin = 15;
						state = true;
						break;
				}
				
				brew.toggle(state, pin, function(response){
					// jQuery('#response').html('PIN ' + pin + ' is: ' + response.status);
				});
			});
		</script>
	</body>
</html>
