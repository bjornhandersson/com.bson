<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍺 BrewMaster Pro - Temperature Control System</title>
    <script src="../js/jquery.min.js" type="text/javascript"></script>
    <script language="javascript" type="text/javascript" src="../js/float/jquery.flot.js"></script>
    <script src="../js/piBrew.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 50%, #6b3e2a 100%);
            color: #f4f1e8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 1.2em;
            color: #f4f1e8;
            opacity: 0.8;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-section {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #8b4513;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .control-section h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-align: center;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 10px;
        }

        .pid-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .input-group input {
            width: 80px;
            padding: 8px;
            border: 2px solid #8b4513;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #f4f1e8;
            text-align: center;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .target-control {
            text-align: center;
        }

        .target-control input {
            width: 120px;
            padding: 12px;
            font-size: 1.2em;
            border: 3px solid #8b4513;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #f4f1e8;
            text-align: center;
            transition: all 0.3s ease;
        }

        .target-control input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #8b4513;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid #8b4513;
        }

        .status-item .label {
            color: #d4af37;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-item .value {
            color: #f4f1e8;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .status-item .unit {
            color: #d4af37;
            font-size: 0.8em;
            margin-left: 5px;
        }

        .control-buttons {
            text-align: center;
            margin-bottom: 30px;
        }

        .brew-button {
            background: linear-gradient(45deg, #8b4513, #a0522d);
            border: 3px solid #d4af37;
            color: #f4f1e8;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .brew-button:hover {
            background: linear-gradient(45deg, #a0522d, #cd853f);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .brew-button:active {
            transform: translateY(0);
        }

        .brew-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .chart-container {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #8b4513;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .chart-container h3 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        #chart {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .brewing-icon {
            font-size: 2em;
            margin-right: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
        }

        .status-indicator.running {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .status-indicator.stopped {
            background: #f44336;
            box-shadow: 0 0 10px #f44336;
        }

        @media (max-width: 768px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .pid-controls {
                grid-template-columns: 1fr;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }

        .beer-foam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="beer-foam">
        <div class="bubble" style="left: 10%; animation-delay: 0s; width: 10px; height: 10px;"></div>
        <div class="bubble" style="left: 20%; animation-delay: 1s; width: 15px; height: 15px;"></div>
        <div class="bubble" style="left: 30%; animation-delay: 2s; width: 8px; height: 8px;"></div>
        <div class="bubble" style="left: 40%; animation-delay: 3s; width: 12px; height: 12px;"></div>
        <div class="bubble" style="left: 50%; animation-delay: 4s; width: 6px; height: 6px;"></div>
        <div class="bubble" style="left: 60%; animation-delay: 5s; width: 14px; height: 14px;"></div>
        <div class="bubble" style="left: 70%; animation-delay: 0.5s; width: 9px; height: 9px;"></div>
        <div class="bubble" style="left: 80%; animation-delay: 1.5s; width: 11px; height: 11px;"></div>
        <div class="bubble" style="left: 90%; animation-delay: 2.5s; width: 7px; height: 7px;"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1><span class="brewing-icon">🍺</span>BrewMaster Pro<span class="brewing-icon">🍺</span></h1>
            <div class="subtitle">Professional Temperature Control System</div>
        </div>

        <div class="control-panel">
            <div class="control-section">
                <h3>🎛️ PID Controller Settings</h3>
                <div class="pid-controls">
                    <div class="input-group">
                        <label for="KP">Proportional (P)</label>
                        <input class="pid" id="KP" type="text" value="0.0" />
                    </div>
                    <div class="input-group">
                        <label for="KI">Integral (I)</label>
                        <input class="pid" id="KI" type="text" value="0.0" />
                    </div>
                    <div class="input-group">
                        <label for="KD">Derivative (D)</label>
                        <input class="pid" id="KD" type="text" value="0.0" />
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>🎯 Target Temperature</h3>
                <div class="target-control">
                    <div class="input-group">
                        <label for="target">Set Temperature</label>
                        <input id="target" value="0.0" />
                        <small style="color: #d4af37; margin-top: 5px;">°Celsius</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-panel">
            <h3 style="color: #d4af37; text-align: center; margin-bottom: 20px; font-size: 1.4em;">
                📊 Brewing Status Monitor
            </h3>
            <div class="status-grid">
                <div class="status-item">
                    <div class="label">🌡️ Current Temperature</div>
                    <div class="value">
                        <span id="spTemp">0.00</span><span class="unit">°C</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="label">🎯 Target Temperature</div>
                    <div class="value">
                        <span id="spTarget">0.00</span><span class="unit">°C</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="label">⚡ Heater Power</div>
                    <div class="value">
                        <span id="spPower">0.00</span><span class="unit">%</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="label">⏱️ Brew Time</div>
                    <div class="value">
                        <span id="spTime">0</span><span class="unit">sec</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-buttons">
            <button id="startStop" class="brew-button" value="start">
                🚀 Start Brewing
                <span id="statusIndicator" class="status-indicator stopped"></span>
            </button>
        </div>

        <div class="chart-container">
            <h3>📈 Temperature & Power Monitoring</h3>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        var dtStart = new Date();
        var brew = new piBrew();
        var tempData = { 
            label: '🌡️ Temperature', 
            color: '#DE5050', 
            data: [[0,0]] 
        };
        
        var setData = { 
            label: '🎯 Target', 
            color: '#49ADDE',
            data: [[0,0]]
        };
        
        var powData = {
            label: '⚡ Power',
            color: '#FFD445',
            data: [[0,0]]
        };
        
        var chart = $.plot(
            $("#chart"), 
            [ tempData, setData, powData ],
            { 
                yaxis: {min:0,max:100},
                grid: {
                    backgroundColor: 'rgba(0,0,0,0.1)',
                    borderColor: '#8b4513',
                    borderWidth: 1
                },
                legend: {
                    backgroundColor: 'rgba(0,0,0,0.6)',
                    color: '#f4f1e8'
                }
            }
        );
        
        var setStatus = function(data){
            var temp = Math.round(data.temp * 100) / 100;
            var target = Math.round(data.target * 100) / 100;
            var power = Math.round(data.power * 100) / 100;
            var seconds = Math.round(new Date(new Date() - dtStart.getTime()).getTime() / 1000);
            
            jQuery('#spTemp').html(temp.toFixed(2));	
            jQuery('#spTarget').html(target.toFixed(2));
            jQuery('#target').attr('value', target.toFixed(2));		
            jQuery('#spPower').html(power.toFixed(2));
            jQuery('#spTime').html(seconds);
            
            // Update status indicator
            var indicator = jQuery('#statusIndicator');
            if(data.started) {
                indicator.removeClass('stopped').addClass('running');
            } else {
                indicator.removeClass('running').addClass('stopped');
            }
            
            var setIfChanged = function(arr, newData){
                if(arr.length > 1 && arr[arr.length -2][1] == newData 
                    && arr[arr.length -1][1] == newData) {
                    arr[arr.length -1][0] = seconds;
                }
                else {
                    arr.push([seconds, newData]);
                }
            }
            
            setIfChanged(tempData.data, temp);
            setIfChanged(setData.data, target);
            setIfChanged(powData.data, power);
            
            if(data.started) {
                chart.setData([tempData, setData, powData]);
                chart.setupGrid();
                chart.draw();
            }
        }
        
        brew.getPID().success(function(data) {
            jQuery('#KP').attr({'value':data.KP});
            jQuery('#KI').attr({'value':data.KI});
            jQuery('#KD').attr({'value':data.KD});
        });

        jQuery('.pid').change(function() {
            brew.setPID(
                jQuery('#KP')[0].value,
                jQuery('#KI')[0].value,
                jQuery('#KD')[0].value
            );
        });
        
        function poll() {
            brew.getStatus().success(function(data) {
                var button = jQuery('#startStop');
                if(data.started) {
                    button.html('🛑 Stop Brewing <span id="statusIndicator" class="status-indicator running"></span>');
                    button.attr('value', 'stop');
                } else {
                    button.html('🚀 Start Brewing <span id="statusIndicator" class="status-indicator stopped"></span>');
                    button.attr('value', 'start');
                }
                setStatus(data);
                setTimeout(poll, 1000);
            });
        }

        jQuery('#target').change(function() {
            brew.setTarget(jQuery(this)[0].value);
        });
        
        jQuery('#startStop').click(function() {
            var _self = this;
            jQuery(this).attr('disabled', 'enabled');
            var st = jQuery(_self).attr('value') == 'start';
            var d = brew.startStop(st);
            d.success(function(data) {
                jQuery(_self).removeAttr('disabled');
            });
        });
        
        poll();
    </script>
</body>
</html>
