<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<title>PIBrew</title>
		<script src="../js/jquery.min.js" type="text/javascript"></script>
		<script language="javascript" type="text/javascript" src="../js/float/jquery.flot.js"></script>
		<script src="../js/piBrew.js"></script>

	</head>
	<body>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			P <input class="pid" id="KP" type="text" value="0.0" />
			I <input class="pid" id="KI" type="text" value="0.0" />
			D <input class="pid" id="KD" type="text" value="0.0" />
		</div>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			Target C <input id="target" value="0.0" />
		</div>
		<div style="border: solid 1px #CECECE;padding:5px;margin:2px">
			Temp:&nbsp;<span id="spTemp"></span>
			Power:&nbsp;<span id="spPower"></span>%
			Target:&nbsp;<span id="spTarget"></span>
		</div>
		<div>
			Time:&nbsp;<span id="spTime" />
		</div>
		<div>
			<input id="startStop" type="button" value="start" />
		</div>
		<div id="chart" style="width:100%;height:300px">
		</div>
		<script>
			var dtStart = new Date();
			var brew = new piBrew();
			var tempData = { 
				label: 'Temp', 
				color: '#DE5050', 
				data: [[0,0]] 
			};
			
			var setData = { 
				label: 'Target', 
				color: '#49ADDE',
				data: [[0,0]]
			};
			
			var powData = {
				label: 'Power',
				color: '#FFD445',
				data: [[0,0]]
			};
			
			var chart = $.plot(
				$("#chart"), 
				[ tempData, setData, powData ],
				{ yaxis: {min:0,max:100 }}
			);
			
			var setStatus = function(data){
				var temp = Math.round(data.temp * 100) / 100;
				var target = Math.round(data.target * 100) / 100;
				var power = Math.round(data.power * 100) / 100;
				var seconds = Math.round(new Date(new Date() - dtStart.getTime()).getTime() / 1000);
				jQuery('#spTemp').html(temp.toFixed(2));	
				jQuery('#spTarget').html(target.toFixed(2));
				jQuery('#target').attr('value', target.toFixed(2));		
				jQuery('#spPower').html(power.toFixed(2));
				jQuery('#spTime').html(seconds);
				
				var setIfChanged = function(arr, newData){
					if(arr.length > 1 && arr[arr.length -2][1] == newData 
						&& arr[arr.length -1][1] == newData) {
						arr[arr.length -1][0] = seconds;
					}
					else {
						arr.push([seconds, newData]);
					}
				}
				
				setIfChanged(tempData.data, temp);
				setIfChanged(setData.data, target);
				setIfChanged(powData.data, power);
				
				if(data.started) {
					chart.setData([tempData, setData, powData]);
					chart.setupGrid();
					chart.draw();
				}
			}
			
			brew.getPID().success(function(data) {
				jQuery('#KP').attr({'value':data.KP});
				jQuery('#KI').attr({'value':data.KI});
				jQuery('#KD').attr({'value':data.KD});
			});

			jQuery('.pid').change(function() {
				brew.setPID(
					jQuery('#KP')[0].value,
					jQuery('#KI')[0].value,
					jQuery('#KD')[0].value
				);
			});
			
			function poll() {
				brew.getStatus().success(function(data) {
					jQuery('#startStop').attr('value', data.started ? 'stop' : 'start');
					setStatus(data);
					setTimeout(poll, 1000);
				});
			}

			jQuery('#target').change(function() {
				brew.setTarget(jQuery(this)[0].value);
			});
			
			jQuery('#startStop').click(function() {
				var _self = this;
				jQuery(this).attr('disabled', 'enabled');
				var st = jQuery(_self).attr('value') == 'start';
				var d = brew.startStop(st);
				d.success(function(data) {
					jQuery(_self).removeAttr('disabled');
					jQuery(_self).attr({'value': (st ? 'stop' : 'start')});
				});
			});
			
			poll();
		</script>
	</body>
</html>
